# Placement AI (optimal tower placement) training config - PPO
# Observations = vector 29 (scalars) + visual grid 8 x 12 x 16 (PlacementGridSensor, CNN)
# grid channels: buildable / path / tower / pathProgress / pathProximity / pathDensity / enemyDensity / towerUtil
# Actions = 3 discrete branches: [1+2*towerTypes, GRID_W, GRID_H] = default [11, 16, 12]
# Behavior Name must be: Placement
behaviors:
  Placement:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 5120
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: match3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    checkpoint_interval: 150000
    max_steps: 6000000
    time_horizon: 64
    summary_freq: 2000
